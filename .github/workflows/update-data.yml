name: Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

concurrency:
  group: update-pokedb-data
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  generate:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install locked runtime and build dependencies
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Load previous generation indexes
        run: |
          mkdir -p .output
          git ls-remote --exit-code --heads origin data > /tmp/pokedb-data-ref || status=$?
          if [ "${status:-0}" = 0 ]; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD 'gen*/index.json' | tar -x -C .output
          elif [ "$status" != 2 ]; then
            exit "$status"
          fi
      - name: Generate and validate every generation
        env:
          POKEDB_GENERATOR_COMMIT: ${{ github.sha }}
        run: python -m pokedb --all --gen all --no-cache --force
      - name: Archive validated output
        run: tar -czf pokedb-data.tar.gz -C .output $(find .output -maxdepth 1 -type d -name 'gen[0-9]*' -printf '%f ')
      - name: Upload validated data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-data
          path: pokedb-data.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download validated data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-data
      - name: Prepare data branch
        run: |
          git ls-remote --exit-code --heads origin data > /tmp/pokedb-data-ref || status=$?
          if [ "${status:-0}" = 0 ]; then
            git fetch --depth=1 origin data
            git worktree add --detach data-branch FETCH_HEAD
          elif [ "$status" = 2 ]; then
            git worktree add --detach data-branch HEAD
            git -C data-branch switch --orphan data-bootstrap
          else
            exit "$status"
          fi
          find data-branch -maxdepth 1 -type d -name 'gen[0-9]*' -exec rm -rf {} +
          tar -xzf pokedb-data.tar.gz -C data-branch
          cp .github/data-branch-README.md data-branch/README.md
          cp LICENSE data-branch/LICENSE
      - name: Commit and publish immutable dataset version
        working-directory: data-branch
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          schema=$(python -c 'import json; from pathlib import Path; p = next(Path(".").glob("gen*/index.json")); print(json.loads(p.read_text())["metadata"]["schema_version"])')
          tag="data-v$schema-$RUN_ID-$RUN_ATTEMPT"
          git commit -m "Regenerate schema v$schema data: $(date -u +'%Y-%m-%d')"
          git tag -a "$tag" -m "PokéDB schema v$schema dataset"
          git push --atomic origin HEAD:data "refs/tags/$tag"
