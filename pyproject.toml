[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokedb"
version = "2.0.0"
description = "A comprehensive and generation-accurate Pokémon database parser"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "zhenga8533", email = "zhenga8533@users.noreply.github.com"}
]
keywords = ["pokemon", "pokeapi", "database", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/pokelitee/pokedb"
Documentation = "https://github.com/pokelitee/pokedb/tree/main/docs"
Repository = "https://github.com/pokelitee/pokedb"
Issues = "https://github.com/pokelitee/pokedb/issues"

[project.scripts]
pokedb = "pokedb.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokedb = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
